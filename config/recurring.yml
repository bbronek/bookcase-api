# Recurring tasks run by the Solid Queue scheduler (bin/jobs).
default: &default
  due_date_reminders:
    class: DueDateRemindersJob
    schedule: every day at 9am
    description: "Email readers 3 days before and on the due date of an active borrowing"

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
