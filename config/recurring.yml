default: &default
  schedule_due_reminders:
    class: ScheduleDueRemindersJob
    schedule: "0 9-21 * * * Europe/Warsaw"
    description: "Queue a reminder email for every borrowing due today or in the next three days; hourly runs retry anything missed"

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
