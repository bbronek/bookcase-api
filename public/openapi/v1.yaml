---
openapi: 3.1.0
info:
  title: Bookcase API
  version: 1.0.0
  description: |
    A JSON API for library staff: the catalog of books, registered readers, lending and returning, and each
    book's borrowing history. Readers are emailed 3 days before a book is due and on the due date.

    ## Typical flow

    1. `POST /api/v1/readers` registers a reader.
    2. `POST /api/v1/books` adds a book.
    3. `POST /api/v1/books/{serial_number}/borrowings` lends it for 30 days and returns the borrowing `id`.
    4. `POST /api/v1/borrowings/{id}/return` takes it back.
    5. `GET /api/v1/books/{serial_number}` shows the book with its full history.

    In development, the seeds provide books `000001` to `000005` and readers `100001` to `100003` to try
    requests with **Test Request**; books `000004` and `000005` are available to lend.

    ## Conventions

    - **Versioning.** Every endpoint except `/health` lives under `/api/v1`. Additive changes ship in v1; a breaking change
      gets `/api/v2`. Clients must ignore fields they do not know.
    - **Identifiers.** Books are addressed by their six-digit serial number, readers by their six-digit card
      number and borrowings by a UUID.
    - **Requests.** Bodies are JSON objects sent as `application/json` in UTF-8. Another media type answers
      `415` and a malformed body `400`. The web server refuses bodies over 10 MB with a bare `413`, not JSON.
    - **Status codes.** `201` with `Location` for a create, `404` for an unknown resource, `405` with `Allow`
      for an unsupported method, `409` for a conflict, `422` for invalid attributes, and `503` with
      `Retry-After` while the database is down or busy.
    - **Errors** are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem documents: `type`, `title`,
      `status`, `detail` and, for invalid attributes, `errors` with a JSON pointer per attribute. Each `type`
      is explained at [/problems](/problems).
    - **Conflicts.** A taken serial number, card number or email answers `409`, even for an identical
      request, and so does lending a book that is borrowed or withdrawn.
    - **Safe to repeat.** Returning a returned borrowing answers `200` unchanged, and withdrawing a withdrawn
      book answers `204` again.
    - **Pagination.** The book list is ordered by serial number and paged with a keyset cursor: `limit`
      (1 to 100, default 50) and `after`. The next page is in the `Link: <...>; rel="next"` header.
    - **Time.** Timestamps are UTC, RFC 3339 with milliseconds. Due dates are calendar dates in the library's
      time zone, Europe/Warsaw.
    - **Concurrency.** Borrowing and withdrawing lock the book, returning locks the borrowing, and a unique
      index allows one active borrowing per book. A lock wait over 2 s or a statement over 5 s answers `503`
      with `Retry-After`.
    - **Request ids.** Every API response, errors included, has an `X-Request-Id` header, and production logs are tagged with it.
      Quote it when reporting a problem.
    - **Authentication** is out of scope for this version.
servers:
- url: "/"
  description: The server this document is served from
tags:
- name: Books
  description: The catalog. Withdrawing a book keeps its borrowing history.
- name: Borrowings
  description: Lending a book to a reader and taking it back.
- name: Readers
  description: People with a library card.
- name: Health
  description: The health check, outside the versioned API.
paths:
  "/api/v1/books":
    get:
      responses:
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '200':
          description: A page of books
          headers:
            Link:
              schema:
                type: string
              required: false
              description: '`<url>; rel="next"` when there is a next page.'
          content:
            application/json:
              example:
              - serial_number: '000001'
                title: Dune
                author: Frank Herbert
                status: borrowed
                withdrawn_at:
                current_borrowing:
                  id: '019a0000-0000-7000-8000-000000000001'
                  borrowed_at: '2026-11-02T09:00:00.000Z'
                  due_on: '2026-12-02'
                  returned_at:
                  reader:
                    card_number: '100001'
                    full_name: Ada Lovelace
                    email: ada@example.com
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Book"
        '400':
          description: Invalid page parameters
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: limit must be an integer between 1 and 100
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: List books
      tags:
      - Books
      operationId: listBooks
      description: Books in the catalog ordered by serial number, with each book's
        status and current borrowing. Withdrawn books are not listed.
      parameters:
      - name: limit
        in: query
        required: false
        description: Books per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: 'Cursor from the `Link: rel="next"` header of the previous page.'
    post:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '413':
          "$ref": "#/components/responses/ContentTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '201':
          description: Book added
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Path of the new book.
          content:
            application/json:
              example:
                serial_number: '000001'
                title: Dune
                author: Frank Herbert
                status: available
                withdrawn_at:
                current_borrowing:
              schema:
                "$ref": "#/components/schemas/Book"
        '409':
          description: The serial number is already taken
          content:
            application/problem+json:
              example:
                type: "/problems#serial-number-taken"
                title: Serial number taken
                status: 409
                detail: Serial number 000001 is already taken
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Invalid attributes
          content:
            application/problem+json:
              example:
                type: "/problems#validation-failed"
                title: Validation failed
                status: 422
                detail: The request has invalid attributes
                errors:
                - pointer: "#/author"
                  detail: must be a string
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Add a book
      tags:
      - Books
      operationId: addBook
      description: Adds a book to the catalog. A serial number already registered,
        including a withdrawn book, answers 409.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NewBook"
        required: true
  "/api/v1/books/{serial_number}":
    get:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '200':
          description: The book and its full history, newest first
          content:
            application/json:
              example:
                serial_number: '000001'
                title: Dune
                author: Frank Herbert
                status: borrowed
                withdrawn_at:
                current_borrowing:
                  id: '019a0000-0000-7000-8000-000000000001'
                  borrowed_at: '2026-11-01T11:00:00.000Z'
                  due_on: '2026-12-01'
                  returned_at:
                  reader:
                    card_number: '100002'
                    full_name: Alan Turing
                    email: alan@example.com
                borrowings:
                - id: '019a0000-0000-7000-8000-000000000001'
                  borrowed_at: '2026-11-01T11:00:00.000Z'
                  due_on: '2026-12-01'
                  returned_at:
                  reader:
                    card_number: '100002'
                    full_name: Alan Turing
                    email: alan@example.com
                - id: '019a0000-0000-7000-8000-000000000002'
                  borrowed_at: '2026-09-01T08:00:00.000Z'
                  due_on: '2026-10-01'
                  returned_at: '2026-09-20T14:00:00.000Z'
                  reader:
                    card_number: '100001'
                    full_name: Ada Lovelace
                    email: ada@example.com
              schema:
                "$ref": "#/components/schemas/BookDetail"
        '404':
          description: No book with this serial number
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Book not found
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Get a book with its borrowing history
      tags:
      - Books
      operationId: getBook
      description: The book, its current borrowing and every borrowing, newest first.
        Withdrawn books stay readable.
    delete:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '204':
          description: Book withdrawn
        '404':
          description: No book with this serial number
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Book not found
              schema:
                "$ref": "#/components/schemas/Problem"
        '409':
          description: The book is borrowed
          content:
            application/problem+json:
              example:
                type: "/problems#book-borrowed"
                title: Book borrowed
                status: 409
                detail: Book 000001 is currently borrowed
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Withdraw a book
      tags:
      - Books
      operationId: withdrawBook
      description: Takes the book out of the catalog. Its history is kept and its
        serial number is never reused. Withdrawing a withdrawn book answers 204 again.
    parameters:
    - name: serial_number
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{6}$"
        example: '000001'
        description: Six digits, leading zeros included. Never reused.
  "/api/v1/books/{serial_number}/borrowings":
    post:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '413':
          "$ref": "#/components/responses/ContentTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '201':
          description: Book lent
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Path of the new borrowing.
          content:
            application/json:
              example:
                id: '019a0000-0000-7000-8000-000000000001'
                borrowed_at: '2026-11-04T09:00:00.000Z'
                due_on: '2026-12-04'
                returned_at:
                reader:
                  card_number: '100001'
                  full_name: Ada Lovelace
                  email: ada@example.com
                book:
                  serial_number: '000001'
                  title: Dune
              schema:
                "$ref": "#/components/schemas/Borrowing"
        '404':
          description: No book with this serial number
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Book not found
              schema:
                "$ref": "#/components/schemas/Problem"
        '409':
          description: The book is already borrowed or withdrawn
          content:
            application/problem+json:
              example:
                type: "/problems#book-borrowed"
                title: Book borrowed
                status: 409
                detail: Book 000001 is currently borrowed
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: The card number is missing or matches no reader
          content:
            application/problem+json:
              example:
                type: "/problems#validation-failed"
                title: Validation failed
                status: 422
                detail: The request has invalid attributes
                errors:
                - pointer: "#/card_number"
                  detail: does not match any reader
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Borrow a book
      tags:
      - Borrowings
      operationId: borrowBook
      description: |
        Lends the book to the reader with this card number. It is due back 30 days later, and the reader is emailed
        3 days before the due date and on it. Keep the borrowing `id` to return the book. A borrowed or withdrawn
        book answers 409, even for the reader who has it.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NewBorrowing"
        required: true
    parameters:
    - name: serial_number
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{6}$"
        example: '000001'
        description: Six digits, leading zeros included. Never reused.
  "/api/v1/borrowings/{id}":
    get:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '200':
          description: The borrowing
          content:
            application/json:
              example:
                id: '019a0000-0000-7000-8000-000000000001'
                borrowed_at: '2026-11-04T09:00:00.000Z'
                due_on: '2026-12-04'
                returned_at:
                reader:
                  card_number: '100001'
                  full_name: Ada Lovelace
                  email: ada@example.com
                book:
                  serial_number: '000001'
                  title: Dune
              schema:
                "$ref": "#/components/schemas/Borrowing"
        '404':
          description: No borrowing with this id
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Borrowing not found
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Get a borrowing
      tags:
      - Borrowings
      operationId: getBorrowing
      description: A borrowing with its book and reader.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Borrowing id.
      description: The borrowing `id` from the borrow response, or the book's `current_borrowing.id`.
  "/api/v1/borrowings/{id}/return":
    post:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '200':
          description: Book returned
          headers:
            Content-Location:
              schema:
                type: string
                format: uri-reference
              description: Path of the borrowing.
          content:
            application/json:
              example:
                id: '019a0000-0000-7000-8000-000000000001'
                borrowed_at: '2026-10-25T09:00:00.000Z'
                due_on: '2026-11-24'
                returned_at: '2026-11-04T09:00:00.000Z'
                reader:
                  card_number: '100001'
                  full_name: Ada Lovelace
                  email: ada@example.com
                book:
                  serial_number: '000001'
                  title: Dune
              schema:
                "$ref": "#/components/schemas/Borrowing"
        '404':
          description: No borrowing with this id
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Borrowing not found
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Return a book
      tags:
      - Borrowings
      operationId: returnBook
      description: Closes the borrowing and makes the book available again. Repeating
        a return changes nothing and answers 200 again.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: Borrowing id.
      description: The borrowing `id` from the borrow response, or the book's `current_borrowing.id`.
  "/api/v1/readers":
    post:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '413':
          "$ref": "#/components/responses/ContentTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '201':
          description: Reader registered
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Path of the new reader.
          content:
            application/json:
              example:
                card_number: '100001'
                full_name: Ada Lovelace
                email: ada@example.com
              schema:
                "$ref": "#/components/schemas/Reader"
        '409':
          description: The card number or email is already registered
          content:
            application/problem+json:
              example:
                type: "/problems#email-taken"
                title: Email taken
                status: 409
                detail: This email is already registered
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: Invalid attributes
          content:
            application/problem+json:
              example:
                type: "/problems#validation-failed"
                title: Validation failed
                status: 422
                detail: The request has invalid attributes
                errors:
                - pointer: "#/card_number"
                  detail: must be exactly six digits
                - pointer: "#/full_name"
                  detail: can't be blank
                - pointer: "#/email"
                  detail: is invalid
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Register a reader
      tags:
      - Readers
      operationId: registerReader
      description: Registers a reader. The email is stored trimmed and lower-cased.
        A card number or email already registered answers 409.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Reader"
        required: true
  "/api/v1/readers/{card_number}":
    get:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '200':
          description: The reader
          content:
            application/json:
              example:
                card_number: '100001'
                full_name: Ada Lovelace
                email: ada@example.com
              schema:
                "$ref": "#/components/schemas/Reader"
        '404':
          description: No reader with this card number
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Reader not found
              schema:
                "$ref": "#/components/schemas/Problem"
      summary: Get a reader
      tags:
      - Readers
      operationId: getReader
      description: A registered reader, by card number.
    parameters:
    - name: card_number
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{6}$"
        example: '100001'
        description: Six digits, leading zeros included.
  "/health":
    get:
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '200':
          description: Healthy
          content:
            application/json:
              example:
                status: ok
              schema:
                "$ref": "#/components/schemas/Health"
        '503':
          description: The database is unreachable
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before checking again.
          content:
            application/json:
              example:
                status: unavailable
              schema:
                "$ref": "#/components/schemas/Health"
      summary: Health check
      tags:
      - Health
      operationId: getHealth
      description: 200 while the application can reach the database, 503 otherwise.
components:
  schemas:
    NewBook:
      type: object
      required:
      - serial_number
      - title
      - author
      properties:
        serial_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '000001'
          description: Six digits, leading zeros included. Never reused.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Dune
        author:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Frank Herbert
      description: A book to add to the catalog.
    Book:
      type: object
      required:
      - serial_number
      - title
      - author
      - status
      - withdrawn_at
      - current_borrowing
      properties:
        serial_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '000001'
          description: Six digits, leading zeros included. Never reused.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Dune
        author:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Frank Herbert
        status:
          type: string
          enum:
          - available
          - borrowed
          - withdrawn
          description: "`withdrawn` once the book left the catalog, else `borrowed`
            while it is lent, else `available`."
        withdrawn_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the book left the catalog; null while it is in the catalog.
        current_borrowing:
          oneOf:
          - "$ref": "#/components/schemas/BookBorrowing"
          - type: 'null'
          description: The open borrowing while the book is lent, otherwise null.
      description: A book with its status and current borrowing.
    BookDetail:
      type: object
      required:
      - serial_number
      - title
      - author
      - status
      - withdrawn_at
      - current_borrowing
      - borrowings
      properties:
        serial_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '000001'
          description: Six digits, leading zeros included. Never reused.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Dune
        author:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Frank Herbert
        status:
          type: string
          enum:
          - available
          - borrowed
          - withdrawn
          description: "`withdrawn` once the book left the catalog, else `borrowed`
            while it is lent, else `available`."
        withdrawn_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the book left the catalog; null while it is in the catalog.
        current_borrowing:
          oneOf:
          - "$ref": "#/components/schemas/BookBorrowing"
          - type: 'null'
          description: The open borrowing while the book is lent, otherwise null.
        borrowings:
          type: array
          items:
            "$ref": "#/components/schemas/BookBorrowing"
          description: Full borrowing history, newest first.
      description: A book with its full borrowing history.
    NewBorrowing:
      type: object
      required:
      - card_number
      properties:
        card_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '100001'
          description: Card number of the reader who borrows the book.
    BookBorrowing:
      type: object
      required:
      - id
      - reader
      - borrowed_at
      - due_on
      - returned_at
      properties:
        id:
          type: string
          format: uuid
          description: Borrowing id.
        reader:
          "$ref": "#/components/schemas/Reader"
        borrowed_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 with milliseconds.
        due_on:
          type: string
          format: date
          description: Calendar date in Europe/Warsaw, 30 days after the borrow.
        returned_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null until the book is returned.
      description: A borrowing as listed under its book.
    Borrowing:
      type: object
      required:
      - id
      - reader
      - borrowed_at
      - due_on
      - returned_at
      - book
      properties:
        id:
          type: string
          format: uuid
          description: Borrowing id.
        reader:
          "$ref": "#/components/schemas/Reader"
        borrowed_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 with milliseconds.
        due_on:
          type: string
          format: date
          description: Calendar date in Europe/Warsaw, 30 days after the borrow.
        returned_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null until the book is returned.
        book:
          "$ref": "#/components/schemas/BookSummary"
      description: A borrowing with its book and reader.
    Reader:
      type: object
      required:
      - card_number
      - full_name
      - email
      properties:
        card_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '100001'
          description: Six digits, leading zeros included.
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Ada Lovelace
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
          description: Stored trimmed and lower-cased; unique.
      description: A reader with a library card.
    BookSummary:
      type: object
      required:
      - serial_number
      - title
      properties:
        serial_number:
          type: string
          pattern: "^[0-9]{6}$"
          example: '000001'
          description: Six digits, leading zeros included. Never reused.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed, with at least one visible character and no control
            characters.
          example: Dune
      description: The borrowed book, in short.
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          example: "/problems#book-borrowed"
          description: "`about:blank` for plain HTTP errors, otherwise a stable reference
            documented at `/problems`."
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        errors:
          type: array
          description: Present when attributes are invalid.
          items:
            type: object
            required:
            - pointer
            - detail
            properties:
              pointer:
                type: string
                example: "#/title"
              detail:
                type: string
                example: can't be blank
      description: An RFC 9457 problem document.
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      description: Whether the application can reach its database.
  responses:
    BadRequest:
      description: Malformed request, such as invalid JSON or UTF-8, a body that is
        not a JSON object, or an invalid query value
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not `application/json`
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    ContentTooLarge:
      description: The body is over 10 MB; the web server refuses it before the application
        runs, with the text `Payload Too Large` and no Content-Type
    ServiceUnavailable:
      description: The database is down, or a lock wait or statement timed out
      headers:
        Retry-After:
          schema:
            type: string
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
