name: bookcase-api

x-app: &app
  image: ${APP_IMAGE:-bookcase-api:development}
  build:
    context: .
    target: development
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_LOG_LEVEL: info
  volumes:
    - mails:/app/tmp/mails
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: bin/rails db:prepare
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://localhost:3000/health/ready')).is_a?(Net::HTTPSuccess)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - { action: sync+restart, path: ./app, target: /app/app }
        - { action: sync+restart, path: ./config, target: /app/config }
        - { action: rebuild, path: Gemfile.lock }

  worker:
    <<: *app
    command: bin/jobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - { action: sync+restart, path: ./app, target: /app/app }
        - { action: sync+restart, path: ./config, target: /app/config }
        - { action: rebuild, path: Gemfile.lock }

volumes:
  postgres-18:
  mails:
